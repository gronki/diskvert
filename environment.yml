# conda environment for building diskvert and regenerating the equations
# (old Python is required by the Python tools; sympy 1.3 reproduces the committed src/mrx*.fi exactly)
name: diskvert
channels:
  - conda-forge
dependencies:
  - python=3.8
  - numpy=1.21
  - matplotlib=3.4
  - scipy
  - gfortran
  - openblas
  - make
  - binutils
  - pip
  - pip:
      # conda-forge has no sympy 1.3 build for Python 3.8
      - sympy==1.3
      - mpmath==1.3.0
