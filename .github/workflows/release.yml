name: Build and release AppImage and Apptainer image

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:

  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build AppImage in Ubuntu 20.04
        run: |
          docker run --rm -v "$PWD:/src" ubuntu:20.04 bash /src/scripts/build_appimage.sh
          sudo chown "$(id -u):$(id -g)" diskvert-x86_64.AppImage

      - name: Smoke test
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1   # runner has no FUSE
        run: ./diskvert-x86_64.AppImage -o test < examples/input.txt

      - uses: actions/upload-artifact@v4
        with:
          name: diskvert-appimage
          path: diskvert-x86_64.AppImage

  build-apptainer:
    name: Build Apptainer image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer

      - name: Build diskvert.sif
        run: |
          sudo apptainer build diskvert-x86_64.sif diskvert.def
          sudo chown "$(id -u):$(id -g)" diskvert-x86_64.sif

      - name: Smoke test
        run: apptainer exec diskvert-x86_64.sif diskvert -o test < examples/input.txt

      - uses: actions/upload-artifact@v4
        with:
          name: diskvert-sif
          path: diskvert-x86_64.sif

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-appimage, build-apptainer]
    if: github.ref_type == 'tag'
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        run: |
          gh release delete ${{ github.ref_name }} --yes 2>/dev/null || true
          gh release create ${{ github.ref_name }} \
            diskvert-x86_64.AppImage diskvert-x86_64.sif \
            --title "diskvert ${{ github.ref_name }}" \
            --notes "AppImage: \`./diskvert-x86_64.AppImage -corona -o disk < input.txt\` (Linux x86_64, glibc 2.31+). Apptainer: \`apptainer exec diskvert-x86_64.sif diskvert ...\` (includes Python tools)."
